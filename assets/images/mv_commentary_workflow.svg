<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Daily market commentary automation stack</title>
  <desc>Two Bloomberg exports feed two reader skills, which pass structured market data and the day's key economic releases into a Morning Views prompt that applies a house-style skill and drafts a formatted daily commentary for analyst review.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c2"/>
    </marker>
  </defs>

  <!-- stage labels -->
  <g fill="#5a6b7d" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <text x="155" y="92">DATA SOURCES</text>
    <text x="450" y="92">READER SKILLS</text>
    <text x="745" y="92">ORCHESTRATION</text>
    <text x="1040" y="92">OUTPUT</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#9fb0c2" stroke-width="2">
    <!-- source top -> skill top -->
    <line x1="270" y1="177.5" x2="329" y2="177.5" marker-end="url(#arrow)"/>
    <!-- source bottom -> skill bottom -->
    <line x1="270" y1="307.5" x2="329" y2="307.5" marker-end="url(#arrow)"/>
    <!-- skill top -> orchestration -->
    <path d="M565 177.5 C 600 177.5, 600 220, 624 232" marker-end="url(#arrow)"/>
    <!-- skill bottom -> orchestration -->
    <path d="M565 307.5 C 600 307.5, 600 265, 624 253" marker-end="url(#arrow)"/>
    <!-- orchestration -> output -->
    <line x1="860" y1="242.5" x2="919" y2="242.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ DATA SOURCES ============ -->
  <!-- top: market indicators export -->
  <g>
    <rect x="40" y="130" width="230" height="95" rx="12" fill="#eef3f8" stroke="#c9d6e4"/>
    <rect x="52" y="146" width="5" height="63" rx="2.5" fill="#4a6785"/>
    <text x="70" y="167" font-size="15" font-weight="700" fill="#12263a">Bloomberg export</text>
    <text x="70" y="188" font-size="11.5" fill="#5a6b7d">Market indicators file</text>
    <text x="70" y="205" font-size="11.5" fill="#5a6b7d">Yields · equities · CDS · FX · commodities</text>
  </g>
  <!-- bottom: WECO calendar -->
  <g>
    <rect x="40" y="260" width="230" height="95" rx="12" fill="#eef3f8" stroke="#c9d6e4"/>
    <rect x="52" y="276" width="5" height="63" rx="2.5" fill="#4a6785"/>
    <text x="70" y="297" font-size="15" font-weight="700" fill="#12263a">Bloomberg WECO</text>
    <text x="70" y="318" font-size="11.5" fill="#5a6b7d">Economic calendar</text>
    <text x="70" y="335" font-size="11.5" fill="#5a6b7d">Scheduled data releases</text>
  </g>

  <!-- ============ READER SKILLS ============ -->
  <!-- top: market-indicators-reader -->
  <g>
    <rect x="335" y="130" width="230" height="95" rx="12" fill="#eaf3f5" stroke="#bcd8de"/>
    <rect x="347" y="146" width="5" height="63" rx="2.5" fill="#1f6f8b"/>
    <text x="365" y="166" font-size="13.5" font-weight="700" fill="#12263a" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">market-indicators</text>
    <text x="365" y="184" font-size="13.5" font-weight="700" fill="#12263a" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">-reader</text>
    <text x="365" y="205" font-size="11.5" fill="#5a6b7d">Extracts and formats market moves</text>
  </g>
  <!-- bottom: weco-reader -->
  <g>
    <rect x="335" y="260" width="230" height="95" rx="12" fill="#eaf3f5" stroke="#bcd8de"/>
    <rect x="347" y="276" width="5" height="63" rx="2.5" fill="#1f6f8b"/>
    <text x="365" y="297" font-size="13.5" font-weight="700" fill="#12263a" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">weco-reader</text>
    <text x="365" y="318" font-size="11.5" fill="#5a6b7d">Surfaces the day's key releases</text>
    <text x="365" y="335" font-size="11.5" fill="#5a6b7d">for macro commentary</text>
  </g>

  <!-- ============ ORCHESTRATION ============ -->
  <g>
    <rect x="630" y="162.5" width="230" height="160" rx="12" fill="#eef3f8" stroke="#c9d6e4"/>
    <rect x="642" y="180" width="5" height="128" rx="2.5" fill="#3a5a7a"/>
    <text x="660" y="200" font-size="15" font-weight="700" fill="#12263a">Morning Views</text>
    <text x="660" y="219" font-size="15" font-weight="700" fill="#12263a">prompt</text>
    <text x="660" y="244" font-size="11.5" fill="#5a6b7d">Assembles the commentary and</text>
    <text x="660" y="261" font-size="11.5" fill="#5a6b7d">applies the house-style skill</text>
    <text x="660" y="286" font-size="11" fill="#7a8a99" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">lucror-style-guide</text>
    <text x="660" y="303" font-size="10.5" fill="#7a8a99">UK spelling · number format · no dashes</text>
  </g>

  <!-- ============ OUTPUT ============ -->
  <g>
    <rect x="925" y="182.5" width="230" height="120" rx="12" fill="#eaf5ee" stroke="#bcdfcb"/>
    <rect x="937" y="198" width="5" height="90" rx="2.5" fill="#1e7a54"/>
    <text x="955" y="222" font-size="15" font-weight="700" fill="#12263a">Drafted daily</text>
    <text x="955" y="241" font-size="15" font-weight="700" fill="#12263a">commentary</text>
    <text x="955" y="266" font-size="11.5" fill="#5a6b7d">House-style, formatted</text>
    <text x="955" y="283" font-size="11.5" fill="#5a6b7d">and ready for analyst review</text>
  </g>

</svg>
