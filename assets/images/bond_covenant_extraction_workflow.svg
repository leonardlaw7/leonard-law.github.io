<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2D4364"/>
    </marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#2E8B57"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="2000" height="2360" fill="#F7F7F4"/>

  <!-- title + subtitle -->
  <text x="1000" y="115" text-anchor="middle" font-size="82" font-weight="bold" fill="#2D4364">Bond Covenant Extraction Workflow</text>
  <text x="1000" y="172" text-anchor="middle" font-size="34" font-style="italic" fill="#5A6472">OM/OC PDF to Indenture Summary, Analysis, Excel table and HTML verifier</text>

  <!-- ============ STEP 1 ============ -->
  <rect x="500" y="220" width="820" height="150" rx="14" fill="#1F3B5C"/>
  <text x="910" y="278" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 1 &#8212; Build page-indexed text layer</text>
  <text x="910" y="322" text-anchor="middle" font-size="27" fill="#B4BFCE" font-family="'Courier New', monospace">extract_om_text.py to &lt;om&gt;_pages.json</text>
  <text x="910" y="358" text-anchor="middle" font-size="25" font-style="italic" fill="#8E9AAB">(OCR fallback if OM is scanned/image-only)</text>

  <line x1="910" y1="370" x2="910" y2="418" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ STEP 2 ============ -->
  <rect x="500" y="420" width="820" height="150" rx="14" fill="#1F3B5C"/>
  <text x="910" y="478" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 2 &#8212; Locate covenant sections</text>
  <text x="910" y="520" text-anchor="middle" font-size="25" fill="#B4BFCE">PRIMARY: Description of the Notes + Definitions</text>
  <text x="910" y="554" text-anchor="middle" font-size="23" fill="#B4BFCE">SECONDARY: Summary of Offering, Risk Factors &#8212; record anchor pages</text>

  <line x1="910" y1="570" x2="910" y2="618" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ STEP 3 ============ -->
  <rect x="500" y="620" width="820" height="150" rx="14" fill="#1F3B5C"/>
  <text x="910" y="678" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 3 &#8212; Extract the 27 fields</text>
  <text x="910" y="720" text-anchor="middle" font-size="26" fill="#B4BFCE">Master_Extraction_Prompt.md, field by field</text>
  <text x="910" y="754" text-anchor="middle" font-size="26" fill="#B4BFCE">Each field: page + section + verbatim source quote</text>

  <line x1="910" y1="770" x2="910" y2="818" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ STEP 4 - QC ============ -->
  <rect x="440" y="820" width="940" height="465" rx="14" fill="#A0481A"/>
  <text x="910" y="882" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 4 &#8212; Quality control (two layers)</text>

  <!-- Layer 1 -->
  <rect x="480" y="905" width="860" height="150" rx="10" fill="#C06B1E"/>
  <text x="910" y="958" text-anchor="middle" font-size="31" font-weight="bold" fill="#FFFFFF">Layer 1 &#8212; deterministic gate</text>
  <text x="910" y="998" text-anchor="middle" font-size="25" fill="#F3DAB8">qc_check.py &#8212; all 27 fields present, quotes verified on cited page</text>
  <text x="910" y="1032" text-anchor="middle" font-size="25" fill="#F3DAB8">Fix every ERROR before Layer 2</text>

  <line x1="910" y1="1055" x2="910" y2="1080" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="480" y="1082" width="860" height="150" rx="10" fill="#C06B1E"/>
  <text x="910" y="1135" text-anchor="middle" font-size="31" font-weight="bold" fill="#FFFFFF">Layer 2 &#8212; semantic review</text>
  <text x="910" y="1175" text-anchor="middle" font-size="25" fill="#F3DAB8">qc_semantic_prompt.md &#8212; completeness, figure accuracy, placeholders</text>
  <text x="910" y="1209" text-anchor="middle" font-size="25" fill="#F3DAB8">extra scrutiny: indebtedness, EoD, redemption, COC, fallaway, guarantee</text>

  <text x="910" y="1262" text-anchor="middle" font-size="25" font-style="italic" fill="#F3DAB8">Published rating = worse of Layer 1 / Layer 2</text>

  <!-- FAIL/ERROR box (left) -->
  <rect x="40" y="855" width="300" height="90" rx="12" fill="#FCEBEB" stroke="#C0392B" stroke-width="2.5"/>
  <text x="190" y="895" text-anchor="middle" font-size="27" font-weight="bold" fill="#B03A2E">FAIL / ERROR</text>
  <text x="190" y="928" text-anchor="middle" font-size="24" fill="#B03A2E">fix &amp; re-extract</text>

  <!-- fallback dashed loop: from FAIL box up to STEP 3 -->
  <path d="M340,890 C440,830 470,760 500,700" fill="none" stroke="#C0392B" stroke-width="4" stroke-dasharray="14,10" marker-end="url(#arrowRed)"/>
  <!-- fallback dashed loop: from QC layer1 to FAIL box -->
  <path d="M480,1000 C420,1010 360,970 342,945" fill="none" stroke="#C0392B" stroke-width="4" stroke-dasharray="14,10" marker-end="url(#arrowRed)"/>

  <!-- PASS arrow down to STEP 5 -->
  <line x1="910" y1="1285" x2="910" y2="1338" stroke="#2E8B57" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <rect x="1005" y="1292" width="365" height="56" rx="10" fill="#EAF7EF" stroke="#4E9E6A" stroke-width="2.5"/>
  <text x="1187" y="1328" text-anchor="middle" font-size="26" font-weight="bold" fill="#2E7D4F">PASS / PASS_WITH_FLAGS</text>

  <!-- ============ STEP 5 ============ -->
  <rect x="500" y="1345" width="820" height="150" rx="14" fill="#1F3B5C"/>
  <text x="910" y="1403" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">STEP 5 &#8212; Write covenant-strength analysis</text>
  <text x="910" y="1445" text-anchor="middle" font-size="26" fill="#B4BFCE">Master_Indenture_Analysis_Prompt.md over QC-passed JSON</text>
  <text x="910" y="1479" text-anchor="middle" font-size="26" fill="#B4BFCE">adds analysis.sections &#8212; six fixed headings, in order</text>

  <line x1="910" y1="1495" x2="910" y2="1543" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ STEP 6 ============ -->
  <rect x="440" y="1545" width="940" height="360" rx="14" fill="#1F3B5C"/>
  <text x="910" y="1603" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 6 &#8212; Generate deliverables</text>
  <text x="910" y="1645" text-anchor="middle" font-size="26" fill="#B4BFCE" font-family="'Courier New', monospace">build_report.py &lt;extraction.json&gt; --om &lt;om.pdf&gt;</text>

  <!-- deliverable sub-boxes -->
  <rect x="480" y="1675" width="410" height="95" rx="8" fill="#EDF0F7"/>
  <text x="685" y="1717" text-anchor="middle" font-size="28" font-weight="bold" fill="#2D4364">Indenture Summary</text>
  <text x="685" y="1750" text-anchor="middle" font-size="23" fill="#5A6472">.docx &#8212; 27 fields, fixed order</text>

  <rect x="930" y="1675" width="410" height="95" rx="8" fill="#EDF0F7"/>
  <text x="1135" y="1717" text-anchor="middle" font-size="28" font-weight="bold" fill="#2D4364">Indenture Analysis</text>
  <text x="1135" y="1750" text-anchor="middle" font-size="23" fill="#5A6472">.docx &#8212; six-section narrative</text>

  <rect x="480" y="1785" width="410" height="95" rx="8" fill="#EDF0F7"/>
  <text x="685" y="1827" text-anchor="middle" font-size="28" font-weight="bold" fill="#2D4364">Field table</text>
  <text x="685" y="1860" text-anchor="middle" font-size="23" fill="#5A6472">.xlsx &#8212; page refs, notes column</text>

  <rect x="930" y="1785" width="410" height="95" rx="8" fill="#EDF0F7"/>
  <text x="1135" y="1827" text-anchor="middle" font-size="28" font-weight="bold" fill="#2D4364">Verifier</text>
  <text x="1135" y="1860" text-anchor="middle" font-size="23" fill="#5A6472">.html &#8212; page-jump + highlight</text>

  <line x1="910" y1="1905" x2="910" y2="1953" stroke="#2D4364" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ STEP 7 ============ -->
  <rect x="500" y="1955" width="820" height="160" rx="14" fill="#1F3B5C"/>
  <text x="910" y="2015" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">STEP 7 &#8212; Analyst review</text>
  <text x="910" y="2057" text-anchor="middle" font-size="26" fill="#B4BFCE">Open the HTML verifier, click through each field</text>
  <text x="910" y="2091" text-anchor="middle" font-size="24" fill="#B4BFCE">Confirm quote supports summary; flag anything thin &#8212; then circulate</text>

  <!-- ============ LEGEND ============ -->
  <line x1="500" y1="2185" x2="1500" y2="2185" stroke="#CFCFC8" stroke-width="2"/>
  <rect x="560" y="2225" width="34" height="24" rx="3" fill="#1F3B5C"/>
  <text x="606" y="2245" font-size="26" fill="#333333">Workflow step</text>
  <rect x="890" y="2225" width="34" height="24" rx="3" fill="#A0481A"/>
  <text x="936" y="2245" font-size="26" fill="#333333">QC checkpoint</text>
  <line x1="1230" y1="2237" x2="1300" y2="2237" stroke="#C0392B" stroke-width="4" stroke-dasharray="12,8"/>
  <text x="1315" y="2245" font-size="26" fill="#333333">Fallback loop on failure</text>
</svg>
